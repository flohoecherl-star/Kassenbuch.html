<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kassenbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10141A;
    --panel:#1A2029;
    --panel-alt:#212934;
    --paper:#ECE6D6;
    --ink:#D8DCE2;
    --muted:#8B94A3;
    --pos:#4E9C7C;
    --neg:#B5533C;
    --gold:#C9A227;
    --line:#2A323D;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px calc(84px + env(safe-area-inset-bottom));}
  h1,h2,h3{font-family:'Fraunces', serif;font-weight:600;margin:0;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
  .topbar h1{font-size:22px;}
  .topbar .sub{font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:var(--muted);}

  /* Monatssaldo — Kontoauszug-Kopf (kein Bon/Perforation mehr) */
  .statement{
    background:var(--panel);
    border-radius:var(--radius);
    padding:22px 22px 20px;
    border-bottom:2px solid var(--gold);
  }
  .statement-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .month-nav{display:flex;align-items:center;gap:10px;}
  .month-nav button{
    background:var(--panel-alt);border:1px solid var(--line);color:var(--ink);
    width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1;
  }
  .month-nav button:hover{border-color:var(--gold);}
  .month-nav .month-label{font-family:'Fraunces',serif;font-size:18px;min-width:150px;text-align:center;}
  .statement-hero{text-align:center;padding:4px 0 22px;}
  .hero-num{font-family:'IBM Plex Mono',monospace;font-size:40px;font-weight:600;line-height:1;letter-spacing:-.01em;}
  .hero-num.pos{color:var(--pos);}
  .hero-num.neg{color:var(--neg);}
  .hero-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:9px;}
  .statement-sub{display:flex;align-items:center;justify-content:center;gap:26px;padding-top:18px;border-top:1px solid var(--line);}
  .sub-item{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .sub-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
  .sub-val{font-family:'IBM Plex Mono',monospace;font-size:15.5px;font-weight:600;}
  .sub-div{width:1px;height:28px;background:var(--line);}

  /* sections */
  .card{background:var(--panel);border-radius:var(--radius);padding:18px 20px;margin-top:16px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .card-head h2{font-size:16px;}
  .hint{font-size:12px;color:var(--muted);margin-top:2px;}
  .add-btn{
    background:var(--panel-alt);border:1px solid var(--line);color:var(--ink);
    padding:8px 14px;border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit;
    min-height:36px;
  }
  .add-btn:hover{border-color:var(--gold);}
  .add-btn:active{transform:scale(0.96);}

  table{width:100%;border-collapse:collapse;}
  tr.row{border-top:1px solid var(--line);}
  tr.row:first-child{border-top:none;}
  td{padding:12px 4px;vertical-align:middle;}
  td.amount{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap;}
  td.amount.neg{color:var(--neg);}
  td.name-cell input, td.amount input, .addline input, .addline select{
    background:transparent;border:none;color:var(--ink);font-family:inherit;font-size:14.5px;
    width:100%;padding:7px 6px;border-radius:7px;min-height:38px;
  }
  td.name-cell input:hover, td.amount input:hover{background:var(--panel-alt);}
  td.name-cell input:focus, td.amount input:focus{background:var(--panel-alt);outline:1px solid var(--gold);}
  .note{font-size:11px;color:var(--muted);display:block;}
  .chip{
    display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
    font-family:'IBM Plex Mono',monospace;white-space:nowrap;
  }
  .del-btn{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;
    padding:0;width:38px;height:38px;border-radius:9px;transition:background .15s,color .15s;
  }
  .del-btn:hover{color:var(--neg);}
  .del-btn:active{transform:scale(0.94);}
  .del-btn.armed{background:var(--neg);color:#fff;font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;}
  .sum-row td{padding-top:12px;border-top:1px solid var(--line);font-weight:600;}

  .addline{
    display:grid;grid-template-columns:100px 1fr 130px 90px 32px;gap:6px;
    background:var(--panel-alt);border-radius:8px;padding:6px 8px;margin-top:10px;align-items:center;
  }
  .addline select{cursor:pointer;}
  .addline button{
    background:var(--gold);border:none;color:#1A1503;font-weight:600;border-radius:6px;
    height:28px;cursor:pointer;font-size:14px;
  }
  .addline.acc{grid-template-columns:1fr 150px 90px 32px;}
  @media(max-width:520px){
    .addline, .addline.acc{grid-template-columns:1fr 1fr;}
    .addline button{grid-column:span 2;}
  }

  .catbar-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px;}
  .catbar-row .label{width:150px;flex-shrink:0;color:var(--muted);}
  .catbar-track{flex:1;height:8px;background:var(--panel-alt);border-radius:6px;overflow:hidden;}
  .catbar-fill{height:100%;border-radius:6px;}
  .catbar-row .val{font-family:'IBM Plex Mono',monospace;width:70px;text-align:right;flex-shrink:0;}

  .trend{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:8px;}
  .trend .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .trend .bar{width:60%;border-radius:4px 4px 0 0;min-height:2px;}
  .trend .m-label{font-size:10px;color:var(--muted);margin-top:6px;font-family:'IBM Plex Mono',monospace;}

  .callout{
    border:1px solid var(--gold);border-radius:8px;padding:12px 14px;margin-top:14px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .callout .t{font-size:13px;}
  .callout .t b{color:var(--gold);}
  .callout .figs{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gold);}

  details.settings{margin-top:20px;}
  details.settings summary{cursor:pointer;color:var(--muted);font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.05em;}
  details.settings .card{margin-top:10px;}

  /* Einklappbare Zusatz-Karten — reduziert Scroll-Länge pro Tab */
  details.card-fold{background:var(--panel);border-radius:var(--radius);margin-top:16px;}
  details.card-fold>summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;-webkit-tap-highlight-color:transparent;}
  details.card-fold>summary::-webkit-details-marker{display:none;}
  details.card-fold>summary::after{content:'▸';color:var(--muted);font-size:13px;transition:transform .15s ease;flex-shrink:0;margin-left:10px;}
  details.card-fold[open]>summary::after{transform:rotate(90deg);}
  details.card-fold>summary h2{font-size:16px;}
  details.card-fold>.fold-body{padding:0 20px 18px;}

  ::selection{background:var(--gold);color:#1A1503;}
  a{color:var(--gold);}
  button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }

  /* Gruppierte Fixkosten */
  tr.group-row td{
    padding:12px 4px 5px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--muted);
  }
  tr.group-row td.amount{font-size:12px;color:var(--ink);}
  .dot{display:inline-block;width:4px;height:13px;border-radius:2px;margin-right:9px;vertical-align:-2px;}

  /* Fixkosten als Karten (statt Tabelle) */
  .fg-list{display:flex;flex-direction:column;gap:8px;}
  .fg-card{background:var(--panel-alt);border-radius:12px;overflow:hidden;}
  .fg-head{
    width:100%;display:flex;align-items:center;gap:11px;padding:12px 12px;
    background:none;border:none;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);
    min-height:56px;
  }
  .fg-head:active{background:rgba(255,255,255,0.03);}
  .fg-badge{
    flex-shrink:0;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:14px;
  }
  .fg-head-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .fg-title{font-size:14.5px;font-weight:500;}
  .fg-sub{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .fg-due{display:block;font-size:11px;color:var(--gold);font-family:'IBM Plex Mono',monospace;margin-top:1px;}
  .fg-head-amt{font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:600;flex-shrink:0;}
  .fg-chevron{
    flex-shrink:0;color:var(--muted);font-size:11px;transition:transform .2s ease;
    width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  }
  .fg-card.open .fg-chevron{transform:rotate(180deg);color:var(--gold);}
  .fg-items{border-top:1px solid var(--line);}
  .fg-item{padding:12px;border-top:1px solid var(--line);}
  .fg-item:first-child{border-top:none;}
  .fg-item-name-row{display:flex;align-items:center;gap:6px;}
  .fg-name{
    flex:1;background:transparent;border:none;color:var(--ink);font-family:inherit;font-size:14.5px;
    font-weight:500;padding:6px 6px;border-radius:7px;min-height:36px;
  }
  .fg-name:hover{background:var(--panel);}
  .fg-name:focus{background:var(--panel);outline:1px solid var(--gold);}
  .fg-item-meta{font-size:11.5px;color:var(--muted);padding:0 6px;line-height:1.5;}
  .fg-item-controls{display:flex;gap:6px;margin-top:8px;align-items:center;}
  .fg-cat-sel{
    flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-size:12.5px;padding:7px 8px;border-radius:8px;
  }
  .fg-amt-wrap{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0;}
  .fg-amt{
    width:74px;background:none;border:none;color:var(--ink);font-family:'IBM Plex Mono',monospace;
    font-size:13.5px;text-align:right;padding:7px 6px 7px 8px;
  }
  .fg-amt-wrap .iv-sel{border:none;background:none;margin:0;border-left:1px solid var(--line);border-radius:0;padding:7px 5px;}

  /* Kleinunternehmen */
  .biz-flow{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
  .biz-line{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13.5px;}
  .biz-line .amount-txt{font-family:'IBM Plex Mono',monospace;}
  .biz-line.result{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:600;}
  .biz-line.result .amount-txt{color:var(--gold);font-size:16px;}
  .inline-num{
    background:var(--panel-alt);border:1px solid var(--line);color:var(--ink);
    width:52px;padding:2px 6px;border-radius:6px;font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;text-align:right;
  }
  .inline-num:focus{outline:1px solid var(--gold);}

  /* Überschuss verteilen */
  .prog-wrap{margin:10px 0 4px;}
  .prog-track{height:10px;background:var(--panel-alt);border-radius:6px;overflow:hidden;}
  .prog-fill{height:100%;background:var(--pos);border-radius:6px;transition:width .3s ease;}
  .prog-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px;font-family:'IBM Plex Mono',monospace;}
  .split-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .split-row:first-of-type{border-top:none;}
  .split-row .left{display:flex;align-items:center;gap:8px;}
  .split-row .euro{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .split-hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .split-hint b{color:var(--gold);font-weight:600;}

  @media(max-width:600px){
    table, tbody{display:block;width:100%;}
    tbody tr{display:grid;align-items:center;column-gap:6px;}
    tbody td{display:block;width:auto !important;padding:3px 2px;}
    /* Fixkosten: Name in voller Breite, darunter Kategorie + Betrag */
    tr[data-kind="fixed"]{grid-template-columns:1fr 92px 38px;}
    tr[data-kind="fixed"] td.name-cell{grid-column:1 / -1;}
    /* Bewegungen: Datum + Name oben, Kategorie + Betrag darunter */
    tr[data-kind="tx"]{grid-template-columns:104px 1fr 92px 38px;}
    tr[data-kind="tx"] td.name-cell{grid-column:2 / -1;}
    tr[data-kind="tx"] td.amount{grid-column:3;}
    /* Einzeiler */
    tr[data-kind="income"], tr.group-row, tr.sum-row{grid-template-columns:1fr 104px 38px;}
    tr[data-kind="account"]{grid-template-columns:1fr 104px 30px 38px;}
    td.amount{font-size:13px;}
    tr[data-kind="biz"]{grid-template-columns:104px 1fr 92px 38px;}
    td select{font-size:12px;}
    tr.row{padding:4px 0;}
  }

  .fade-in{animation:fadeIn .35s ease both;}

  .fade-in{animation:fadeIn .35s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* Backup-Buttons */
  .backup-btns{display:flex;gap:6px;}
  .backup-btns .add-btn{padding:5px 9px;font-size:12px;}

  /* KPI-Strip unter dem Beleg */
  .kpi-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
  .kpi{background:var(--panel);border-radius:var(--radius);padding:12px 10px;text-align:center;}
  .kpi .eyebrow{display:block;margin-bottom:5px;}
  .kpi b{font-family:'IBM Plex Mono',monospace;font-size:17px;display:block;}
  .kpi b.pos{color:var(--pos);} .kpi b.neg{color:var(--neg);}
  .kpi .kpi-note{font-size:10.5px;color:var(--muted);}

  /* Aufklappbare Gruppen */
  tr.group-row.toggle{cursor:pointer;}
  tr.group-row.toggle:hover td{color:var(--ink);}
  .caret{display:inline-block;width:12px;color:var(--muted);font-size:10px;}
  .grp-count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);opacity:.7;}
  .due-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);margin-left:6px;}
  .due-now{color:var(--gold);}

  /* Intervall- & Fälligkeits-Selects */
  .iv-sel{background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;border-radius:5px;padding:2px 3px;margin-top:3px;width:100%;cursor:pointer;}
  .iv-sel:focus{outline:1px solid var(--gold);}
  .anchor-sel{background:var(--panel-alt);border:1px solid var(--line);color:var(--ink);
    font-size:10.5px;border-radius:5px;padding:1px 2px;cursor:pointer;}
  td.amount{position:relative;}

  /* Scope (Gemeinsam/Privat) */
  .scope-wrap{display:inline-flex;gap:4px;margin-top:4px;}
  .scope-sel, .who-sel{background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);
    font-family:'IBM Plex Mono',monospace;font-size:10px;border-radius:5px;padding:1px 4px;cursor:pointer;}
  .scope-sel.gemeinsam, .who-sel.gemeinsam{color:var(--gold);border-color:rgba(201,162,39,.4);}
  .scope-sel:focus, .who-sel:focus{outline:1px solid var(--gold);}

  /* Paar-Aufteilung */
  .name-inline{background:var(--panel-alt);border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-size:13.5px;border-radius:6px;padding:1px 6px;width:90px;}
  .name-inline:focus{outline:1px solid var(--gold);}
  .pair-head{font-size:12.5px;font-weight:600;color:var(--ink);margin:16px 0 4px;}
  .pair-grid{display:grid;grid-template-columns:1fr auto auto;gap:5px 16px;font-size:13.5px;align-items:baseline;}
  .pair-grid .h{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;text-align:right;text-transform:uppercase;letter-spacing:.05em;}
  .pair-grid .v{font-family:'IBM Plex Mono',monospace;text-align:right;}
  .pair-grid .v.neg{color:var(--neg);}
  .pair-grid .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;font-weight:600;}

  /* Kommende Fälligkeiten */
  .trend .up-val{font-size:9px;color:var(--gold);font-family:'IBM Plex Mono',monospace;margin-bottom:2px;}

  /* Sparziele */
  .goal{padding:10px 0;border-top:1px solid var(--line);}
  .goal:first-of-type{border-top:none;}
  .goal-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .goal-name{flex:1;background:transparent;border:none;color:var(--ink);font-family:inherit;font-size:14px;font-weight:500;padding:2px;border-radius:6px;}
  .goal-name:hover{background:var(--panel-alt);}
  .goal-name:focus{background:var(--panel-alt);outline:1px solid var(--gold);}
  .goal-pct{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);}
  .goal-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .goal-meta .inline-num{width:70px;}

  /* Finanz-Check */
  .check-list{display:flex;flex-direction:column;gap:2px;}
  .check-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);}
  .check-row:first-child{border-top:none;}
  .check-dot{width:4px;height:22px;border-radius:2px;flex-shrink:0;}
  .check-label{font-size:13.5px;width:130px;flex-shrink:0;}
  .check-txt{font-size:12.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  @media(max-width:520px){ .check-label{width:108px;} .check-txt{font-size:11.5px;} }

  /* --- Fix: Beträge dürfen nicht aus der Zeile laufen --- */
  tr.group-row td.amount{font-variant-numeric:tabular-nums;}
  .due-line{display:block;font-size:11px;color:var(--gold);font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .grp-name{display:block;line-height:1.35;}
  .avg-tag{display:block;font-size:9.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;}

  /* Donut */
  .donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;}
  .donut-legend{flex:1;min-width:190px;display:flex;flex-direction:column;gap:5px;}
  .lg-row{display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .lg-row .lg-name{flex:1;}
  .lg-row .lg-val{font-family:'IBM Plex Mono',monospace;color:var(--muted);}
  .donut-center{font-family:'IBM Plex Mono',monospace;}

  /* Projektion */
  .proj-inputs{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:10px;}
  .proj-inputs label{display:flex;align-items:center;gap:5px;}
  .proj-legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:6px;justify-content:center;flex-wrap:wrap;}
  .proj-legend span{display:flex;align-items:center;gap:5px;}
  .proj-key{width:10px;height:10px;border-radius:2px;display:inline-block;}

  /* Tipps */
  .tip{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line);}
  .tip:first-of-type{border-top:none;}
  .tip .ic{font-size:16px;line-height:1.3;flex-shrink:0;width:20px;text-align:center;}
  .tip .tx{font-size:13px;line-height:1.5;}
  .tip .tx b{color:var(--gold);font-weight:600;}
  .tip .tx b.tt{display:block;font-weight:600;font-size:13px;margin-bottom:1px;color:var(--ink);}
  .disclaimer{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.5;border-top:1px solid var(--line);padding-top:10px;}

  /* Einnahmen-Gruppen */

// Lokale, dauerhafte Speicherung im Browser (funktioniert auch als Datei / auf GitHub Pages).

// ---------- Haushaltskonto: CSV-Import (ING-Umsatzexport) ----------
function readFileAsText(file, encoding){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
    if(encoding) r.readAsText(file, encoding); else r.readAsText(file);
  });
}
function parseCsvLine(line, delim){
  const out=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQ){
      if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else { inQ=false; } }
      else cur+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===delim){ out.push(cur); cur=''; }
      else cur+=ch;
    }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function parseGermanAmount(s){
  if(s===undefined||s===null) return NaN;
  const cleaned = String(s).replace(/[^0-9,.-]/g,'').replace(/\./g,'').replace(',', '.');
  return parseFloat(cleaned);
}
function guessHhCategory(label){
  const l=(label||'').toUpperCase();
  const RULES = [
    [/REWE|EDEKA|ALDI|LIDL|NETTO|KAUFLAND|PENNY|NORMA|BIO\s?COMPANY|DENNS|DENN'S/,'lebensmittel'],
    [/\bDM\b|ROSSMANN|MUELLER|M[UÜ]LLER|BUDNI/,'drogerie'],
    [/APOTHEKE|SANIT[AÄ]TS/,'gesundheit'],
    [/H&M|ZARA|C&A|PRIMARK|ABOUT YOU|ZALANDO|DEICHMANN|SNIPES/,'kleidung'],
    [/IKEA|OBI\b|HORNBACH|BAUHAUS|POCO|XXXLUTZ|KIK\b|TEDI/,'haushalt'],
    [/KITA|KINDERGARTEN|SPIELZEUG|BABY/,'kinder']
  ];
  for(const [re,cat] of RULES){ if(re.test(l)) return cat; }
  return 'sonstiges';
}
// Erwartet den Umsatzexport aus dem ING-Onlinebanking (CSV, Spalten u.a. "Buchung"/"Betrag").
function parseIngCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) throw new Error('Datei ist leer.');
  const delim = lines[0].includes(';') ? ';' : ',';
  let headerIdx=-1, cols=[];
  for(let i=0;i<lines.length;i++){
    const parts = parseCsvLine(lines[i], delim);
    if(parts.some(p=>/^buchung$/i.test(p)) && parts.some(p=>/betrag/i.test(p))){ headerIdx=i; cols=parts; break; }
  }
  if(headerIdx===-1) throw new Error('Kein ING-Kontoauszug erkannt (Spalte „Buchung" fehlt). Bitte den CSV-Export aus dem ING-Onlinebanking verwenden.');
  const iDate = cols.findIndex(c=>/^buchung$/i.test(c));
  const iWho = cols.findIndex(c=>/Auftraggeber|Empf[aä]nger/i.test(c));
  const iPurpose = cols.findIndex(c=>/Verwendungszweck/i.test(c));
  const iText = cols.findIndex(c=>/Buchungstext/i.test(c));
  let iAmount=-1; for(let k=cols.length-1;k>=0;k--){ if(/betrag/i.test(cols[k])){ iAmount=k; break; } }
  if(iDate===-1 || iAmount===-1) throw new Error('Spalten „Buchung"/„Betrag" nicht gefunden.');
  const out=[];
  for(let i=headerIdx+1;i<lines.length;i++){
    const parts = parseCsvLine(lines[i], delim);
    if(parts.length<2) continue;
    const m = (parts[iDate]||'').match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    if(!m) continue;
    const date = `${m[3]}-${m[2]}-${m[1]}`;
    const amount = parseGermanAmount(parts[iAmount]);
    if(!isFinite(amount) || amount>=0) continue; // nur echte Ausgaben, keine Eingänge/Übertrag
    const who = (iWho>=0 ? parts[iWho] : '').trim();
    const purpose = (iPurpose>=0 ? parts[iPurpose] : '').trim();
    const txt = (iText>=0 ? parts[iText] : '').trim();
    const label = (who || purpose || txt || 'Ausgabe').slice(0,60);
    out.push({ date, label, amount: Math.round(Math.abs(amount)*100)/100 });
  }
  return out;
}
async function importHouseholdCsv(file){
  let text;
  try{ text = await readFileAsText(file, 'UTF-8'); }
  catch(e){ alert('Datei konnte nicht gelesen werden.'); return; }
  if(text.indexOf('\uFFFD')!==-1){ // Mojibake-Anzeichen -> als ISO-8859-1 erneut lesen
    try{ text = await readFileAsText(file, 'ISO-8859-1'); }catch(e){}
  }
  let rows;
  try{ rows = parseIngCsv(text); }
  catch(e){ alert('Import fehlgeschlagen: '+e.message); return; }
  if(!rows.length){ alert('Keine Ausgaben gefunden — es werden nur Buchungen mit negativem Betrag importiert.'); return; }

  const byMonth = {};
  rows.forEach(r=>{ (byMonth[r.date.slice(0,7)]=byMonth[r.date.slice(0,7)]||[]).push(r); });

  let added=0, skipped=0;
  for(const mk of Object.keys(byMonth)){
    const isCurrent = mk===currentMonthKey;
    let d = isCurrent ? monthData : await storageGet(`month:${mk}`);
    if(!d) d = defaultMonth();
    if(!d.household) d.household=[];
    const existingKeys = new Set(d.household.map(h=>`${h.date}|${h.label}|${Number(h.amount).toFixed(2)}`));
    byMonth[mk].forEach(r=>{
      const key = `${r.date}|${r.label}|${r.amount.toFixed(2)}`;
      if(existingKeys.has(key)){ skipped++; return; }
      d.household.push({id:uid(), date:r.date, label:r.label, category:guessHhCategory(r.label), amount:r.amount, source:'csv'});
      existingKeys.add(key); added++;
    });
    await storageSet(`month:${mk}`, d);
    if(isCurrent) monthData = d;
  }
  await loadHistory(); render();
  alert(`Import abgeschlossen: ${added} neue Ausgabe${added===1?'':'n'} übernommen${skipped?`, ${skipped} Duplikat${skipped===1?'':'e'} übersprungen`:''}.`);
}

// ---------- Haushaltskonto: Screenshot-Import (Anthropic Vision API) ----------
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(String(r.result).split(',')[1]);
    r.onerror = ()=>reject(r.error);
    r.readAsDataURL(file);
  });
}
async function analyzeReceiptScreenshot(file){
  const base64 = await fileToBase64(file);
  const mediaType = file.type || 'image/jpeg';
  const today = new Date().toISOString().slice(0,10);
  const sysPrompt = `Du extrahierst Bankbuchungen aus einem Screenshot einer Banking-App (Umsatzliste). Heutiges Datum: ${today}.
Gib AUSSCHLIESSLICH ein JSON-Array zurück — keine Erklärung, kein Markdown, kein Text davor oder danach.
Jedes Element: {"date":"YYYY-MM-DD","label":"Empfänger/Bezeichnung","amount":Zahl}.
- amount: immer positiv, nur der Betrag der Ausgabe (Beträge mit Minus im Screenshot).
- Nur echte Ausgaben/Lastschriften/Kartenzahlungen aufnehmen — KEINE Gehaltseingänge, Gutschriften, Überweisungen an sich selbst, Kontostände oder Summenzeilen.
- Relative Datumsangaben ("Heute", "Gestern", Wochentage) anhand des heutigen Datums in YYYY-MM-DD umrechnen. Fehlt das Jahr, aktuelles Jahr annehmen.
- Ist ein Betrag oder Datum nicht sicher lesbar, den Eintrag weglassen.
- Wenn keine Buchungen erkennbar sind, gib [] zurück.`;
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      system: sysPrompt,
      messages:[{
        role:'user',
        content:[
          {type:'image', source:{type:'base64', media_type:mediaType, data:base64}},
          {type:'text', text:'Extrahiere alle Ausgaben aus diesem Screenshot als JSON-Array.'}
        ]
      }]
    })
  });
  if(!response.ok) throw new Error('API-Anfrage fehlgeschlagen ('+response.status+').');
  const data = await response.json();
  const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const cleaned = textBlocks.replace(/```json|```/g,'').trim();
  let rows;
  try{ rows = JSON.parse(cleaned); }catch(e){ throw new Error('Antwort konnte nicht gelesen werden.'); }
  if(!Array.isArray(rows)) throw new Error('Unerwartetes Format in der Antwort.');
  return rows.filter(r=>r && r.date!=null && r.amount!=null).map(r=>({
    date: String(r.date).slice(0,10),

// Haushaltskonto: Soll-Kontostand am Monatsende (nutzt echten Bankstand, falls eingetragen)
function hhClosingBalance(d){
  const opening = Number(d.hhOpening||0);
  const inflow = Number(d.hhInflow!==undefined ? d.hhInflow : ((settings&&settings.householdBudget)||650));
  const spent = (d.household||[]).reduce((s,h)=>s+Number(h.amount||0),0);
  const soll = opening + inflow - spent;
  const actual = (d.hhActualBalance===null||d.hhActualBalance===undefined||d.hhActualBalance==='') ? null : Number(d.hhActualBalance);
  return actual!==null ? actual : soll;
}

async function loadMonth(key){
  let d = await storageGet(`month:${key}`);
  if(!d){
    // Neuer Monat: wiederkehrende Einnahmen (Gehalt, Kindergeld, Übertrag) aus dem Vormonat übernehmen
    const prev = await storageGet(`month:${shiftMonth(key,-1)}`);
    if(prev && (prev.income||[]).length){
      d = { income: prev.income.map(i=>({id:uid(), label:i.label, amount:Number(i.amount||0), person:i.person||'ich'})),
            transactions:[], business:[], household:[] };
    } else {
      d = defaultMonth();
    }
    // Haushaltskonto: Anfangsbestand = Schlussstand des Vormonats (echter Bankstand, falls eingetragen)
    d.hhOpening = prev ? Math.round(hhClosingBalance(prev)*100)/100 : 0;
    d.hhInflow = (settings && settings.householdBudget) || 650;
    d.hhActualBalance = null;
    await storageSet(`month:${key}`, d);
  }
  if(!d.business) d.business = [];
  if(!d.household) d.household = [];
  if(!d.accountTx) d.accountTx = {};
  if(d.hhOpening===undefined) d.hhOpening = 0;
  if(d.hhInflow===undefined) d.hhInflow = (settings && settings.householdBudget) || 650;
  if(d.hhActualBalance===undefined) d.hhActualBalance = null;
  // Migration: Einnahmen einer Person zuordnen (Partner-Übertrag erkennen)
  let mig=false;
  const pName = (settings && settings.household && settings.household.partnerName) || 'Sophie';
  (d.income||[]).forEach(i=>{
    if(i.person===undefined){
      const l=(i.label||'').toLowerCase();
      i.person = (l.includes(pName.toLowerCase()) || l.includes('partner') || l.includes('anteil')) ? 'sophie' : 'ich';
      mig=true;
    }
  });
  if(mig) await storageSet(`month:${key}`, d);
  currentMonthKey = key;
  monthData = d;
}

async function loadHistory(){
  history = [];
  for(let i=5;i>=0;i--){
    const key = shiftMonth(currentMonthKey, -i);
    const d = (key===currentMonthKey) ? monthData : await storageGet(`month:${key}`);
    if(d){

}

// Geglätteter Monatsbetrag (Quartal/Jahr auf den Monat umgelegt)
function fcMonthly(fc){
  const amt=Number(fc.amount||0), iv=fc.interval||'monat';
  return iv==='jahr' ? amt/12 : iv==='quartal' ? amt/3 : amt;
}
// Tatsächlich in diesem Monat fällig (echter Kontoabgang)
function fcDueThisMonth(fc, monthKey){
  const iv=fc.interval||'monat', amt=Number(fc.amount||0);
  if(iv==='monat') return amt;
  const m=Number(monthKey.split('-')[1]);
  const anchor=Number(fc.anchor||1);
  if(iv==='jahr') return m===anchor ? amt : 0;
  return ((m-anchor)%3+3)%3===0 ? amt : 0; // Quartal: anchor, +3, +6, +9
}
// Alt-Daten (nur Monatsbetrag + Notiz) einmalig auf Intervalle heben
function detectInterval(fc){
  fc.interval='monat';
  const note=fc.note||'';
  const parseNum=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.'));
  const mQ=note.match(/([\d.,]+)\s*€\s*\/\s*Quartal/i);
  const mJ=note.match(/([\d.,]+)\s*€\s*\/\s*Jahr/i);
  if(mQ){ fc.interval='quartal'; fc.amount=parseNum(mQ[1]); delete fc.note; }
  else if(mJ){ fc.interval='jahr'; fc.amount=parseNum(mJ[1]); delete fc.note; }
}

function totals(d, monthKey){
  const list = settings.fixedCosts||[];
  const incomeTotal = (d.income||[]).reduce((s,i)=>s+Number(i.amount||0),0);
  const fixedSmooth = list.reduce((s,f)=>s+fcMonthly(f),0);
  const fixedDue    = list.reduce((s,f)=>s+fcDueThisMonth(f, monthKey),0);
  const variableTotal = (d.transactions||[]).reduce((s,i)=>s+Number(i.amount||0),0);
  const expenseActual = fixedDue + variableTotal;      // echter Kassenabgang
  const expenseSmooth = fixedSmooth + variableTotal;   // planbarer Durchschnitt
  const balanceActual = incomeTotal - expenseActual;
  const balanceSmooth = incomeTotal - expenseSmooth;
  const byCat = {}; // Kategorienverteilung geglättet, damit Monate vergleichbar bleiben
  list.forEach(f=>{ byCat[f.category]=(byCat[f.category]||0)+fcMonthly(f); });
  (d.transactions||[]).forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+Number(t.amount||0); });
  return { incomeTotal, fixedSmooth, fixedDue, variableTotal, expenseActual, expenseSmooth, balanceActual, balanceSmooth, byCat };
}
