    const done = current>=target && target>0;
    const remaining = Math.max(0, target-current);
    const monthsLeft = done ? 0 : (monthly>0 ? Math.ceil(remaining/monthly) : null);
    let eta='';
    if(done){ eta='<b class="due-now">erreicht ✓</b>'; }
    else if(monthsLeft===null){ eta='noch keine Sparrate gesetzt'; }
    else {
      const d=new Date(); d.setMonth(d.getMonth()+monthsLeft);
      eta=`noch ${eur(remaining)} · ${monthsLeft} Mon. (${MONTH_NAMES_SHORT[d.getMonth()]} ${d.getFullYear()})`;
    }
    return `
    <div class="goal" data-kind="goal" data-id="${go.id}">
      <div class="goal-head">
        <input type="text" class="goal-name" value="${escAttr(go.label)}" data-field="label">
        <span class="goal-pct">${pct}&nbsp;%</span>
        <button class="del-btn" data-action="del-goal" data-id="${go.id}">✕</button>
      </div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${done?'var(--pos)':'var(--gold)'}"></div></div>
      <div class="goal-meta">
        <input type="number" step="50" class="inline-num" value="${current}" data-field="current"> /
        <input type="number" step="50" class="inline-num" value="${target}" data-field="target"> € ·
        <input type="number" step="10" class="inline-num" style="width:58px" value="${monthly}" data-field="monthly"> €/Mon · ${eta}
      </div>
    </div>`;
  }).join('');
  const goalsMonthlySum = (settings.goals||[]).filter(g=>Number(g.current||0)<Number(g.target||0)).reduce((s,g)=>s+Number(g.monthly||0),0);

  // Jahresübersicht
  const ys = await yearSummary();
  const ysRate = ys.inc>0 ? Math.round(ys.save/ys.inc*100) : 0;

  // Finanz-Check (Ampel)
  const GREEN='var(--pos)', YELLOW='var(--gold)', RED='var(--neg)';
  const checks = [
    (()=>{ const v=fairRateA; return {label:'Sparquote (fair)', color: v>=15?GREEN:(v>=8?YELLOW:RED),
      txt: v>=15?`${v}% — stark`:(v>=8?`${v}% — okay, Luft nach oben`:`${v}% — zu niedrig`) }; })(),
    (()=>{ const v=runwayMonths; return {label:'Notgroschen', color: v>=4?GREEN:(v>=2?YELLOW:RED),
      txt: v>=4?`${v.toFixed(1)} Monate — gut abgesichert`:(v>=2?`${v.toFixed(1)} Monate — weiter auffüllen`:`${v.toFixed(1)} Monate — knapp`) }; })(),
    (()=>{ const v=t.balanceSmooth; return {label:'Monatsbilanz', color: v>0?GREEN:RED,
      txt: v>0?`+${eur(v)} planbar übrig`:`${eur(v)} — Ausgaben ≥ Einnahmen` }; })(),
    (()=>{ const v=fixQuote; const basis = hasB?' (Haushalt)':' (nur du)'; return {label:'Fixkostenquote'+basis, color: v<=50?GREEN:(v<=65?YELLOW:RED),
      txt: v<=50?`${v}% — guter Puffer`:(v<=65?`${v}% — wenig Spielraum`:`${v}% — sehr hoch`) }; })(),
  ];
  if(budgetCats.length){
    checks.push({label:'Budgets', color: anyOverBudget?RED:(anyNearBudget?YELLOW:GREEN),
      txt: anyOverBudget?'ein Limit überschritten':(anyNearBudget?'ein Limit fast erreicht':'alle im Rahmen')});
  }
  // ---------- Donut: Ausgabenverteilung ----------
  const donutData = Object.entries(t.byCat)
    .map(([id,amt])=>({c:catInfo(id, settings.categories), amt}))
    .filter(d=>d.amt>0).sort((a,b)=>b.amt-a.amt);
  const donutTotal = donutData.reduce((s,d)=>s+d.amt,0);
  const DR=54, DCIRC=2*Math.PI*DR;
  let dAcc=0;
  const donutSegs = donutData.map(d=>{
    const len = donutTotal>0 ? (d.amt/donutTotal)*DCIRC : 0;
    const seg = `<circle cx="72" cy="72" r="${DR}" fill="none" stroke="${d.c.color}" stroke-width="20"
      stroke-dasharray="${len.toFixed(2)} ${(DCIRC-len).toFixed(2)}" stroke-dashoffset="${(-dAcc).toFixed(2)}"
      transform="rotate(-90 72 72)"><title>${escHtml(d.c.label)}: ${eur(d.amt)}</title></circle>`;
    dAcc += len; return seg;
  }).join('');
  const donutLegend = donutData.map(d=>`
    <div class="lg-row">
      <span class="dot" style="background:${d.c.color};margin-right:0"></span>
      <span class="lg-name">${escHtml(d.c.label)}</span>
      <span class="lg-val">${donutTotal>0?Math.round(d.amt/donutTotal*100):0}&nbsp;% · ${eur(d.amt)}</span>
    </div>`).join('');

  // ---------- Vermögens-Projektion (Zinseszins) ----------
  const pj = settings.projection || {monthly:300, years:20, rate:6};
  const pjYears = Math.max(1, Math.min(45, Number(pj.years)||20));
  const pjRate  = Math.max(0, Math.min(15, Number(pj.rate)||0));
  const pjMonthly = Math.max(0, Number(pj.monthly)||0);
  const pjStart = depotSum;
  const pjPts = [];
  {
    const r = pjRate/100/12;
    let v = pjStart, paid = pjStart;
    pjPts.push({v, paid});
    for(let i=1;i<=pjYears*12;i++){ v = v*(1+r) + pjMonthly; paid += pjMonthly; if(i%12===0) pjPts.push({v, paid}); }
  }
  const pjEnd = pjPts[pjPts.length-1];
  const pjGain = pjEnd.v - pjEnd.paid;
  const pjMax = Math.max(pjEnd.v, 1);
  const PW=330, PH=155, PLx=4, PB=20;
  const pxAt = i => PLx + (i/(pjPts.length-1))*(PW-2*PLx);
  const pyAt = v => (PH-PB) - (v/pjMax)*(PH-PB-10);
  const pjLine = key => pjPts.map((p,i)=>`${i?'L':'M'}${pxAt(i).toFixed(1)},${pyAt(p[key]).toFixed(1)}`).join(' ');
  const pjArea = key => `${pjLine(key)} L${pxAt(pjPts.length-1).toFixed(1)},${PH-PB} L${pxAt(0).toFixed(1)},${PH-PB} Z`;
  const pjTicks = pjPts.map((p,i)=>i).filter(i=> i>0 && (i % (pjYears>=20?5:(pjYears>=10?2:1))===0))
    .map(i=>`<text x="${pxAt(i).toFixed(1)}" y="${PH-6}" fill="#8B94A3" font-size="9" text-anchor="middle" font-family="IBM Plex Mono, monospace">${i}J</text>`).join('');

  // ---------- Spar- & Anlagetipps (aus deinen Zahlen) ----------
  const freizeitAbos = (settings.fixedCosts||[]).filter(f=>f.category==='freizeit');
  const aboMonthly = freizeitAbos.reduce((s,f)=>s+fcMonthly(f),0);
  const biggestFix = (settings.fixedCosts||[]).slice().sort((a,b)=>fcMonthly(b)-fcMonthly(a))[0];
  const tips = [];
  if(runwayMonths < 3){
    tips.push({ic:'🛟', tt:'Notgroschen zuerst', tx:`Dein Sparkonto deckt <b>${runwayMonths.toFixed(1)} Monate</b> Fixkosten. Mit einem zweiten Kind gelten 3–6 Monate als üblicher Richtwert. Bis dahin ist Tagesgeld sinnvoller als jede Rendite — Geld, das jederzeit verfügbar sein muss, gehört nicht an die Börse.`});
  } else if(!notgroschenFull){
    tips.push({ic:'🛟', tt:'Notgroschen fast da', tx:`${runwayMonths.toFixed(1)} Monate gedeckt, noch <b>${eur(Math.max(0,Number(inv.ziel)-sparSum))}</b> bis zu deinem Ziel. Ab dann kann der Notgroschen-Anteil in den Sparplan wandern.`});
  } else {
    tips.push({ic:'✅', tt:'Notgroschen steht', tx:`${runwayMonths.toFixed(1)} Monate gedeckt. Alles, was jetzt zusätzlich auf dem Tagesgeld liegt, verliert real gegen die Inflation — der Überschuss kann in den langfristigen Topf.`});
  }
  if(aboMonthly>0){
    tips.push({ic:'🔁', tt:'Abo-Check', tx:`Deine Freizeit-Abos kosten <b>${eur(aboMonthly)}/Monat</b> — das sind <b>${eur(aboMonthly*12)} im Jahr</b>. Einmal im Jahr durchgehen: was hast du in den letzten 4 Wochen wirklich genutzt? Gekündigte Abos wirken jeden Monat, ohne dass du etwas tun musst.`});
  }
  if(fixQuote>0){
    tips.push({ic:'⚖️', tt:'Fixkostenquote', tx:`<b>${fixQuote}&nbsp;%</b> ${hasB?`eures gemeinsamen Nettoeinkommens (${eur(hhIncome)})`:'deiner Einnahmen'} sind fest gebunden${biggestFix?`, größter Einzelposten ist ${escHtml(biggestFix.label)} mit ${eur(fcMonthly(biggestFix))}/Monat`:''}. Unter 50&nbsp;% bleibt Luft für schlechte Monate — als Trader mit schwankendem Einkommen zählt das doppelt.${!hasB?` Trag ${escHtml(pName)}s Netto unten bei „Paar-Aufteilung" ein, dann rechne ich die Quote gegen das echte Haushaltseinkommen statt nur gegen deins.`:''}`});
  }
  if(upMaxItem && upMaxItem.dueTotal - upAvg > 100){
    tips.push({ic:'📅', tt:'Teure Monate vorfinanzieren', tx:`Im ${monthLabel(upMaxItem.key)} werden <b>${eur(upMaxItem.dueTotal)}</b> fällig — ${eur(upMaxItem.dueTotal-upAvg)} über dem Schnitt. Statt jedes Jahr überrascht zu werden: den Jahresbetrag durch 12 teilen und monatlich auf ein separates Rechnungs-Konto legen.`});
  }
  if(sharedIncome>0){
    tips.push({ic:'👶', tt:'Kindergeld arbeiten lassen', tx:`Ihr bekommt <b>${eur(sharedIncome)}/Monat</b>. Wenn ein Teil davon nicht für laufende Kosten gebraucht wird, ist ein separates Depot auf den Namen des Kindes eine verbreitete Variante — Vorteil: eigener Sparerpauschbetrag und Grundfreibetrag. Nachteil: Das Geld gehört dann rechtlich dem Kind und ist mit 18 nicht mehr eure Entscheidung.`});
  }
  tips.push({ic:'🧾', tt:'Sparerpauschbetrag nutzen', tx:`Kapitalerträge sind pro Person bis <b>1.000&nbsp;€ im Jahr</b> steuerfrei (Ehepaare zusammen 2.000&nbsp;€) — aber nur, wenn bei der Bank ein Freistellungsauftrag hinterlegt ist. Ohne ihn führt die Bank Abgeltungsteuer ab, die du dir erst über die Steuererklärung zurückholen musst.`});
  if(pjMonthly>0){
    tips.push({ic:'📈', tt:'Zeit schlägt Betrag', tx:`Bei ${eur(pjMonthly)}/Monat und ${pjRate}&nbsp;% Annahme kommen in ${pjYears} Jahren rechnerisch <b>${eur(pjEnd.v)}</b> zusammen — davon <b>${eur(pjGain)}</b> aus der Wertentwicklung. Die Rendite ist eine Annahme, keine Zusage; Kurse schwanken und können auch fallen.`});
  }
  if(anyOverBudget){
    tips.push({ic:'🚨', tt:'Budget gerissen', tx:`Mindestens ein Monatslimit ist überschritten. Bei dir hängt das erfahrungsgemäß eher am Kopf als am Konto — dieselbe Regeltreue, die du im Trading trackst, gilt hier auch.`});
  }

  const tipRows = tips.map(tp=>`
    <div class="tip"><span class="ic">${tp.ic}</span><span class="tx"><b class="tt">${tp.tt}</b>${tp.tx}</span></div>`).join('');

  const checkRows = checks.map(c=>`
    <div class="check-row">
      <span class="check-dot" style="background:${c.color}"></span>
      <span class="check-label">${c.label}</span>
      <span class="check-txt">${c.txt}</span>
    </div>`).join('');

  app.innerHTML = `
    <div class="topbar">
      <div>
        <h1>Kassenbuch</h1>
        <div class="sub">Privater Monatsabschluss</div>
      </div>
      <div class="backup-btns">
        <button class="add-btn" data-action="export-backup">↓ Sichern</button>
        <button class="add-btn" data-action="import-backup">↑ Laden</button>
        <input type="file" id="import-file" accept="application/json" style="display:none">
      </div>
    </div>


    <div class="statement fade-in" data-tab="monat">
      <div class="statement-head">
        <div class="eyebrow">Kassensturz</div>
        <div class="month-nav">
          <button data-action="prev-month">‹</button>
          <div class="month-label">${monthLabel(currentMonthKey)}</div>
          <button data-action="next-month">›</button>
        </div>
      </div>
      <div class="statement-hero">
        <div class="hero-num ${balClass}">${eur(t.balanceActual)}</div>
        <div class="hero-label">${balWord} · Ist-Stand</div>
      </div>
      <div class="statement-sub">
        <div class="sub-item"><span class="sub-label">Einnahmen</span><span class="sub-val">${eur(t.incomeTotal)}</span></div>
        <div class="sub-div"></div>
        <div class="sub-item"><span class="sub-label">Ausgaben</span><span class="sub-val">${eur(t.expenseActual)}</span></div>
      </div>
    </div>

    <div class="kpi-strip" data-tab="monat">
      <div class="kpi"><span class="eyebrow">Sparquote Ich</span><b class="${fairRateA>=15?'pos':(fairRateA>=0?'':'neg')}">${fairRateA}&nbsp;%</b><span class="kpi-note">fair, nach Anteil</span></div>
      <div class="kpi"><span class="eyebrow">Sparquote Haushalt</span><b class="${hhRate>=15?'pos':(hhRate>=0?'':'neg')}">${hasB?hhRate+'&nbsp;%':'—'}</b><span class="kpi-note">${hasB?'Ziel 15–25 %':pName+'-Netto fehlt'}</span></div>
      <div class="kpi"><span class="eyebrow">Notgroschen</span><b class="${runwayMonths>=3?'pos':'neg'}">${runwayMonths.toFixed(1)}</b><span class="kpi-note">Monate gedeckt</span></div>
    </div>
    <div class="hint" data-tab="monat" style="text-align:center;margin-top:8px;">
      Oben der reine Kassensturz über dein Konto${partnerTransfer>0?` (inkl. ${eur(partnerTransfer)} von ${escHtml(pName)})`:''}${sharedIncome>0?` und ${eur(sharedIncome)} gemeinsame Einnahmen`:''}. Die faire Sparquote rechnet dagegen nur mit deinem eigenen Einkommen und deinem gerechten Kostenanteil.
    </div>

    <div class="card" data-tab="monat">
      <div class="card-head"><h2>Finanz-Check</h2></div>
      <div class="check-list">${checkRows}</div>
    </div>

    <div class="card" data-tab="monat">
      <div class="card-head"><h2>Einnahmen</h2>
        <button class="add-btn" data-action="add-income">+ Einnahme</button>
      </div>
      <div class="hint">Persönliche Einnahmen — Gehalt, Übertrag von ${escHtml(pName)}, Nebeneinkünfte.</div>
      <table><tbody>${incomeRows}
        ${ownIncomeList.length>1?`<tr class="sum-row"><td>Summe</td><td class="amount">${eur(ownIncomeSum)}</td><td></td></tr>`:''}
      </tbody></table>
    </div>

    <div class="card" data-tab="monat">
      <div class="card-head"><h2>Gemeinsame Einnahmen</h2>
        <button class="add-btn" data-action="add-kindergeld">+ Kindergeld</button>
      </div>
      <div class="hint">Geld, das euch beiden gehört: Kindergeld, Elterngeld, Rückerstattungen. Es zählt voll in den Kassensturz, wird aber keinem von euch persönlich zugerechnet — im Tab „Paar" deckt es zuerst die gemeinsamen Kosten ab.</div>
      <table><tbody>${sharedIncomeRows}
        ${sharedIncomeList.length?`<tr class="sum-row"><td>Summe gemeinsam</td><td class="amount">${eur(sharedIncome)}</td><td></td></tr>`:''}
      </tbody></table>
      ${!sharedIncomeList.length?`<div class="hint" style="margin-top:8px;">Noch nichts erfasst. „+ Kindergeld" legt einen Posten mit ${eur(KINDERGELD_2026)} an — dem Satz pro Kind seit Januar 2026.</div>`:
        `<div class="split-hint">Kindergeld 2026: <b>${eur(KINDERGELD_2026)}</b> pro Kind und Monat. Bei zwei Kindern also ${eur(KINDERGELD_2026*2)} — den Betrag kannst du direkt anpassen.</div>`}
    </div>

    <div class="card" data-tab="monat">
      <div class="card-head"><h2>Fixkosten</h2>
        <div style="display:flex;gap:6px;">
          <button class="add-btn" data-action="toggle-all-groups">${anyOpen?'Alle einklappen':'Alle ausklappen'}</button>
          <button class="add-btn" data-action="add-fixed">+ Posten</button>
        </div>
      </div>
      <div class="hint">Kategorie antippen zum Auf-/Zuklappen. Quartals-/Jahresposten mit vollem Betrag eintragen und Intervall wählen — sie erscheinen nur im Fälligkeitsmonat als echter Abgang.</div>
      <div class="fg-list">${fixedRows}</div>
      <div class="split-row" style="margin-top:4px;"><div class="left"><b>Ø pro Monat (geglättet)</b></div><div class="euro">${eur(t.fixedSmooth)}</div></div>
      <div class="split-row"><div class="left" style="color:var(--muted)">davon in ${monthLabel(currentMonthKey)} tatsächlich fällig</div><div class="euro" style="color:var(--muted)">${eur(t.fixedDue)}</div></div>
    </div>

    <div class="card" data-tab="vermoegen">
      <div class="card-head"><h2>Kommende Fälligkeiten</h2></div>
      <div class="hint">Tatsächliche Fixkosten-Abgänge der nächsten 12 Monate. Goldene Balken = teurere Monate durch Quartals-/Jahresrechnungen.</div>
      <div class="trend" style="height:130px;">${upcomingBars}</div>
      <div class="split-hint">Teuerster Monat: <b>${eur(upMaxItem.dueTotal)}</b> im ${monthLabel(upMaxItem.key)} — das sind <b>${eur(upMaxItem.dueTotal-upMin)}</b> mehr als im günstigsten. Halte für solche Monate genug auf dem Konto.</div>
    </div>

    <div class="card" data-tab="monat">
      <div class="card-head"><h2>Bewegungen</h2></div>
      <div class="hint">Einmalige & spontane Ausgaben — Challenges, Onlinekäufe, alles außerhalb der Fixkosten.</div>
      <table><tbody>${txRows}
        ${monthData.transactions.length? `<tr class="sum-row"><td colspan="3">Summe Bewegungen</td><td class="amount">${eur(t.variableTotal)}</td><td></td></tr>`:''}
      </tbody></table>
      <button class="add-btn" style="width:100%;margin-top:10px;" data-action="open-add-tx">+ Bewegung erfassen</button>
      ${challenge.count>0 ? `
      <div class="callout">
        <div class="t">Challenges <b>${year}</b>: ${challenge.count} Käufe</div>
        <div class="figs">${eur(challenge.total)}</div>
      </div>`:''}
    </div>

    <div class="card fade-in" data-tab="haushalt">
      <div class="card-head"><h2>Haushaltskonto</h2></div>
      <div class="hint">Konsumausgaben vom gemeinsamen Haushaltskonto — Lebensmittel, Drogerie & Co. Läuft getrennt vom Kassensturz oben; die monatliche Überweisung dorthin steht schon als Fixkosten-Posten „Haushaltskonto".</div>
      <div class="kpi-strip" style="display:grid;">
        <div class="kpi"><span class="eyebrow">Ausgegeben</span><b class="${hhOver?'neg':''}">${eur(hhTotal)}</b><span class="kpi-note">${monthLabel(currentMonthKey)}</span></div>
        <div class="kpi"><span class="eyebrow">Budget</span><b>${eur(hhBudget)}</b><span class="kpi-note">monatlich</span></div>
        <div class="kpi"><span class="eyebrow">${hhOver?'Über Limit':'Übrig'}</span><b class="${hhOver?'neg':'pos'}">${eur(Math.abs(hhRemaining))}</b><span class="kpi-note">${hhPct}% genutzt</span></div>
      </div>
      <div class="prog-wrap">
        <div class="prog-track"><div class="prog-fill" style="width:${Math.min(100,Math.max(0,hhPct))}%;background:${hhOver?'var(--neg)':'var(--pos)'}"></div></div>
      </div>
      ${hhIsCurrentRealMonth && hhDaysElapsed>=5 && hhBudget>0 ? `
      <div class="callout" style="${hhProjOver?'border-color:var(--neg)':''}">
        <div class="t">Hochrechnung Monatsende <b style="${hhProjOver?'color:var(--neg)':'color:var(--pos)'}">${hhProjOver?'über Budget':'im Rahmen'}</b></div>
        <div class="figs" style="${hhProjOver?'color:var(--neg)':''}">≈ ${eur(hhProjected)}</div>
      </div>`:''}
    </div>

    <details class="card-fold fade-in" data-tab="haushalt">
      <summary><h2>Statistik</h2></summary>
      <div class="fold-body">
      ${hhList.length ? `
      <div class="hint">Verteilung der Haushaltskonto-Ausgaben in ${monthLabel(currentMonthKey)}.</div>
      ${hhCatRows}
      <div class="hint" style="margin-top:14px;">Ausgaben der letzten 6 Monate${hhBudget>0?' — rot = über Budget':''}.</div>
      <div class="trend">${hhTrendBars}</div>`
      : '<div class="hint">Noch nichts erfasst.</div>'}
      </div>
    </details>

    <details class="card-fold fade-in" data-tab="haushalt">
      <summary><h2>Kontostand-Abgleich</h2></summary>
      <div class="fold-body">
      <div class="hint">Anfangsbestand wird automatisch aus dem Vormonat übernommen. Trag den echten Kontostand aus der Banking-App ein, um Buchungslücken zu finden.</div>
      <div class="split-row"><div class="left">Anfangsbestand</div><div class="euro"><input type="number" step="1" class="inline-num" style="width:90px" value="${hhOpening}" data-hhfield="opening"> €</div></div>
      <div class="split-row"><div class="left">+ Einzahlung diesen Monat</div><div class="euro"><input type="number" step="10" class="inline-num" style="width:90px" value="${hhInflow}" data-hhfield="inflow"> €</div></div>
      <div class="split-row"><div class="left">− Ausgaben erfasst</div><div class="euro">− ${eur(hhTotal)}</div></div>
      <div class="split-row" style="border-top:1px solid var(--line);margin-top:2px;padding-top:8px;"><div class="left"><b>Soll-Kontostand</b></div><div class="euro"><b>${eur(hhSollClosing)}</b></div></div>
      <div class="split-row"><div class="left">Kontostand lt. Bank <span class="note" style="display:inline">(optional)</span></div><div class="euro"><input type="number" step="1" class="inline-num" style="width:90px" value="${hhActual===null?'':hhActual}" placeholder="—" data-hhfield="actual"> €</div></div>
      ${hhDiff!==null ? `
      <div class="split-hint" style="${Math.abs(hhDiff)>=1?'':''}">
        ${Math.abs(hhDiff)<1
          ? `Stimmt überein. <b style="color:var(--pos)">${eur(hhDiff)}</b> Abweichung — im Rahmen von Rundung.`
          : hhDiff<0
            ? `Abweichung: <b style="color:var(--neg)">${eur(hhDiff)}</b> — auf dem Konto ist weniger als erwartet. Möglicherweise fehlt eine Buchung in der Liste oben, oder eine Kartenzahlung ist noch nicht final abgebucht.`
            : `Abweichung: <b style="color:var(--gold)">+${eur(hhDiff)}</b> — auf dem Konto ist mehr als erwartet. Prüfen, ob eine Einzahlung nicht als „Einzahlung diesen Monat" erfasst ist.`}
      </div>`:''}
      </div>
    </details>

    ${hhTipRows ? `
    <details class="card-fold fade-in" data-tab="haushalt">
      <summary><h2>Finanztipps</h2></summary>
      <div class="fold-body">
      <div class="hint">Aus deinen Haushaltskonto-Zahlen abgeleitet.</div>
      ${hhTipRows}
      </div>
    </details>`:''}

    <div class="card fade-in" data-tab="haushalt">
      <div class="card-head"><h2>Ausgaben</h2>
        <button class="add-btn" data-action="open-add-hh">+ Ausgabe</button>
      </div>
      <table><tbody>${hhRows}
        ${hhList.length? `<tr class="sum-row"><td colspan="3">Summe</td><td class="amount">${eur(hhTotal)}</td><td></td></tr>`:''}
      </tbody></table>
      ${!hhList.length?`<div class="hint" style="margin-top:6px;">Noch nichts erfasst — manuell hinzufügen oder den ING-Kontoauszug importieren.</div>`:''}
      <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:14px;">
        <div class="hint" style="margin-bottom:8px;">CSV-Export aus dem ING-Onlinebanking importieren (nur Ausgaben, keine Eingänge — Duplikate werden automatisch erkannt).</div>
        <button class="add-btn" style="width:100%;" data-action="import-hh-csv">↑ ING-CSV importieren</button>
        <input type="file" id="import-hh-csv" accept=".csv,text/csv" style="display:none">
      </div>
      <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:14px;">
        <div class="hint" style="margin-bottom:8px;">Oder einfach einen Screenshot deiner Umsätze aus der Banking-App schicken — die Buchungen werden automatisch erkannt und vor dem Übernehmen zur Prüfung angezeigt.</div>
        <button class="add-btn" style="width:100%;" data-action="import-hh-shot">📷 Screenshot importieren</button>
        <input type="file" id="import-hh-shot" accept="image/*" style="display:none">
      </div>
    </div>

    <details class="settings" data-tab="haushalt">
      <summary>Haushaltskonto-Einstellungen</summary>
      <div class="card">
        <div class="field" style="margin-bottom:14px;">
          <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-family:'IBM Plex Mono',monospace;">Monatliches Budget (€)</label>
          <input type="number" step="10" class="inline-num" style="width:110px" value="${hhBudget}" data-hhbudget>
        </div>
        <table><tbody>
        ${hhCategories.map(c=>`
          <tr class="row" data-kind="hhcategory" data-id="${c.id}">
            <td class="name-cell"><input type="text" value="${escAttr(c.label)}" data-field="label"></td>
            <td style="width:44px"><input type="color" value="${c.color}" data-field="color" style="width:36px;height:26px;border:none;background:none;padding:0;"></td>
          </tr>`).join('')}
        </tbody></table>
        <button class="add-btn" style="width:100%;margin-top:12px;" data-action="open-add-hhcat">+ Kategorie hinzufügen</button>
      </div>
    </details>

    <details class="card-fold" data-tab="vermoegen">
      <summary><h2>Wohin geht dein Geld</h2></summary>
      <div class="fold-body">
      <div class="hint">Alle Ausgaben dieses Monats, geglättet gerechnet — damit Quartals- und Jahresrechnungen die Verteilung nicht verzerren.</div>
      ${donutTotal>0 ? `
      <div class="donut-wrap">
        <svg viewBox="0 0 144 144" width="144" height="144" role="img" aria-label="Ausgabenverteilung">
          <circle cx="72" cy="72" r="${DR}" fill="none" stroke="var(--panel-alt)" stroke-width="20"></circle>
          ${donutSegs}
          <text class="donut-center" x="72" y="68" text-anchor="middle" fill="#D8DCE2" font-size="15" font-weight="600">${eur(donutTotal).replace(/\s?€/,'')}</text>
          <text class="donut-center" x="72" y="84" text-anchor="middle" fill="#8B94A3" font-size="9" letter-spacing="1">€ / MONAT</text>
        </svg>
        <div class="donut-legend">${donutLegend}</div>
      </div>
      <div style="margin-top:16px;">${catRows}</div>`
      : '<div class="hint">Noch keine Ausgaben erfasst.</div>'}
      </div>
    </details>

    <details class="card-fold" data-tab="monat">
      <summary><h2>Budgets</h2></summary>
      <div class="fold-body">
      <div class="hint">Monatslimit für variable Ausgaben (Bewegungen) je Kategorie. Limits stellst du im Tab „Vermögen" unter „Kategorien verwalten" ein.</div>
      ${budgetRows || '<div class="hint">Noch keine Budgets gesetzt.</div>'}
      </div>
    </details>

    <div class="card" data-tab="paar">
      <div class="card-head"><h2>Paar-Aufteilung</h2></div>
      <div class="hint">Faire Verteilung der gemeinsamen Kosten nach Nettoeinkommen (Ø/Monat). Jeden Fixkostenposten kannst du oben als <b>Gemeinsam</b> oder <b>Privat</b> markieren.</div>

      <div class="biz-flow" style="border-top:none;padding-top:2px;">
        <div class="biz-line"><span>Netto Ich <span class="note" style="display:inline">aus Einnahmen</span></span>
          <span class="amount-txt">${eur(incA)}</span></div>
        <div class="biz-line"><span>Netto <input type="text" class="name-inline" value="${escAttr(pName)}" data-household="partnerName"></span>
          <span class="amount-txt"><input type="number" step="10" class="inline-num" style="width:88px" value="${incB}" data-household="incomeB"> €</span></div>
        <div class="biz-line result"><span>Zusammen</span><span class="amount-txt">${eur(incTotal)}</span></div>
        ${sharedIncome>0?`<div class="biz-line"><span>+ Gemeinsame Einnahmen <span class="note" style="display:inline">Kindergeld &amp; Co. — zählt keinem allein</span></span><span class="amount-txt" style="color:var(--pos)">${eur(sharedIncome)}</span></div>`:''}
      </div>

      ${hasB ? `
      <div class="prog-wrap">
        <div class="prog-track"><div class="prog-fill" style="width:${Math.round(shareApct*100)}%;background:#5C7A99"></div></div>
        <div class="prog-meta"><span>Ich ${Math.round(shareApct*100)}&nbsp;%</span><span>${escHtml(pName)} ${Math.round(shareBpct*100)}&nbsp;%</span></div>
      </div>` : `<div class="split-hint">Trag ${escHtml(pName)}s Netto ein — dann rechne ich die faire Quote aus. Bis dahin gilt 50/50. (${escHtml(pName)} überweist dir aktuell ${eur(partnerTransfer)} als Anteil.)</div>`}

      <div style="margin-top:12px;">
        <div class="split-row"><div class="left"><span class="dot" style="background:var(--gold)"></span>Gemeinsame Kosten (Ø)</div><div class="euro">${eur(sharedFixed)}</div></div>
        ${sharedIncome>0?`<div class="split-row"><div class="left"><span class="dot" style="background:var(--pos)"></span>− Gemeinsame Einnahmen</div><div class="euro" style="color:var(--pos)">− ${eur(sharedIncome)}</div></div>
        <div class="split-row"><div class="left"><b>Rest, den ihr aufteilt</b></div><div class="euro">${eur(sharedNet)}</div></div>`:''}
        <div class="split-row"><div class="left">Dein fairer Anteil</div><div class="euro">${eur(fairA)}</div></div>
        <div class="split-row"><div class="left">${escHtml(pName)}s fairer Anteil</div><div class="euro">${eur(fairB)}</div></div>
      </div>
      <div class="split-hint">${sharedIncome>0?`Kindergeld & Co. fließen zuerst in die gemeinsamen Kosten — erst der Rest wird nach Einkommen geteilt. `:''}Zum Vergleich 50/50: je <b>${eur(sharedNet/2)}</b>.${hasB && Math.abs(fairB - sharedNet/2) >= 1 ? ` Nach Einkommen zahlt ${escHtml(pName)} ${fairB<sharedNet/2?'weniger':'mehr'} — das ist der faire Ausgleich.` : ''}${partnerTransfer>0 && hasB ? ` ${escHtml(pName)} überweist aktuell ${eur(partnerTransfer)}; fair wären ${eur(fairB)}${Math.abs(partnerTransfer-fairB)>=10?` (${partnerTransfer<fairB?'zu wenig':'mehr als nötig'})`:''}.` : ''}</div>

      <div class="pair-head">Was bleibt jedem (Ø/Monat)</div>
      <div class="pair-grid">
        <span></span><span class="h">Ich</span><span class="h">${escHtml(pName)}</span>
        <span>Einkommen</span><span class="v">${eur(incA)}</span><span class="v">${eur(incB)}</span>
        <span>− Anteil gemeinsam${sharedIncome>0?' <span class="note" style="display:inline">nach Kindergeld</span>':''}</span><span class="v">${eur(fairA)}</span><span class="v">${eur(fairB)}</span>
        <span>− Private Fixkosten</span><span class="v">${eur(privA)}</span><span class="v">${eur(privB)}</span>
        <span>− Spontanausgaben</span><span class="v">${eur(t.variableTotal)}</span><span class="v">—</span>
        <span class="tot">Bleibt frei</span><span class="v tot ${restA>=0?'':'neg'}">${eur(restA)}</span><span class="v tot ${restB>=0?'':'neg'}">${eur(restB)}</span>
      </div>
      <div class="split-hint">Deine faire Sparquote: <b>${fairRateA}&nbsp;%</b>${hasB?` · Haushalt zusammen: <b>${hhRate}&nbsp;%</b>`:''}. Faires Ziel: beiden bleibt anteilig etwa gleich viel Luft. ${escHtml(pName)}s private Posten kannst du oben mit „Privat → ${escHtml(pName)}" erfassen.</div>
    </div>

    <div class="card" data-tab="vermoegen">
      <div class="card-head"><h2>Konten-Übersicht</h2></div>
      <div class="hint">Alles an einem Ort — Girokonto & Haushaltskonto laufend berechnet, Sparen/Depot/Gewerbe trägst du manuell ein.</div>
      <table><tbody>
        <tr class="row" style="opacity:.85;">
          <td class="name-cell">Girokonto <span class="note" style="display:inline">(dieser Monat)</span></td>
          <td class="amount ${t.balanceActual>=0?'':'neg'}">${eur(t.balanceActual)}</td><td></td>
        </tr>
        <tr class="row" style="opacity:.85;">
          <td class="name-cell">Haushaltskonto <span class="note" style="display:inline">(Soll)</span></td>
          <td class="amount ${hhSollClosing>=0?'':'neg'}">${eur(hhActual!==null?hhActual:hhSollClosing)}</td><td></td>
        </tr>
        ${accountRows}
        <tr class="sum-row"><td>Sparen/Depot/Gewerbe</td><td class="amount">${eur(totalWealth)}</td><td></td></tr>
      </tbody></table>
      <button class="add-btn" style="width:100%;margin-top:10px;" data-action="open-add-account">+ Konto hinzufügen</button>
      <div class="split-hint">Dein Notgroschen (${eur(sparSum)}) reicht für <b>${runwayMonths.toFixed(1)} Monate</b> Fixkosten. ${runwayMonths<3?'Unter 3 Monaten — mit Kind unterwegs würde ich das priorisiert auffüllen.':runwayMonths<4?'Solide; mit zweitem Kind sind 4–6 Monate ein gutes Ziel.':'Gut abgesichert.'}</div>
    </div>

    <div class="card" data-tab="vermoegen">
      <div class="card-head"><h2>Sparziele</h2>
        <button class="add-btn" data-action="add-goal">+ Ziel</button>
      </div>
      <div class="hint">Eigene Töpfe mit Zielbetrag und monatlicher Sparrate. Trag den aktuellen Stand ein, ich rechne aus, wann du am Ziel bist.</div>
      ${goalRows || '<div class="hint">Noch keine Ziele — leg mit „+ Ziel" los.</div>'}
      ${goalsMonthlySum>0 ? `<div class="split-hint">Summe deiner aktiven Sparraten: <b>${eur(goalsMonthlySum)}/Monat</b>. ${goalsMonthlySum > Math.max(0,t.balanceSmooth) ? `Das ist mehr als dein planbarer Überschuss (${eur(Math.max(0,t.balanceSmooth))}) — Ziele oder Raten anpassen.` : `Passt in deinen planbaren Überschuss von ${eur(Math.max(0,t.balanceSmooth))}.`}</div>`:''}
    </div>

    <details class="card-fold" data-tab="vermoegen">
      <summary><h2>Überschuss verteilen</h2></summary>
      <div class="fold-body">
      <div class="hint">Vorschlag auf Basis des planbaren Überschusses (Ø/Monat): ${eur(surplus)}. Rechnungs-lastige Monate fängst du aus dem Notgroschen ab.</div>

      <div class="prog-wrap">
        <div class="prog-track"><div class="prog-fill" style="width:${progPct}%"></div></div>
        <div class="prog-meta">
          <span>Notgroschen: ${eur(sparSum)} <span style="opacity:.7">(= Sparkonten)</span></span>
          <span>Ziel: <input type="number" step="500" class="inline-num" style="width:74px" value="${inv.ziel}" data-invest="ziel"> € (${progPct}&nbsp;%)</span>
        </div>
      </div>

      <div style="margin-top:14px;">
        <div class="split-row">
          <div class="left"><span class="dot" style="background:var(--pos)"></span>Notgroschen (Tagesgeld)
            <input type="number" min="0" max="100" class="inline-num" value="${inv.splitNotgroschen}" data-invest="splitNotgroschen"> %</div>
          <div class="euro">${eur(splitAmt(inv.splitNotgroschen))}</div>
        </div>
        <div class="split-row">
          <div class="left"><span class="dot" style="background:#5C7A99"></span>ETF-Sparplan
            <input type="number" min="0" max="100" class="inline-num" value="${inv.splitEtf}" data-invest="splitEtf"> %</div>
          <div class="euro">${eur(splitAmt(inv.splitEtf))}</div>
        </div>
        <div class="split-row">
          <div class="left"><span class="dot" style="background:var(--gold)"></span>Frei / Gönnen
            <input type="number" min="0" max="100" class="inline-num" value="${inv.splitFrei}" data-invest="splitFrei"> %</div>
          <div class="euro">${eur(splitAmt(inv.splitFrei))}</div>
        </div>
      </div>
      ${splitSum!==100 ? `<div class="split-hint">Die Aufteilung ergibt aktuell <b>${splitSum}&nbsp;%</b> statt 100&nbsp;%.</div>`:''}
      ${notgroschenFull
        ? `<div class="split-hint"><b>Notgroschen voll.</b> Du kannst den Notgroschen-Anteil jetzt in den ETF umleiten.</div>`
        : `<div class="split-hint">Solange der Notgroschen unter dem Ziel liegt, hat er Vorrang vor dem Investieren.</div>`}
      </div>
    </details>

    <details class="card-fold" data-tab="vermoegen">
      <summary><h2>Wenn du dranbleibst</h2></summary>
      <div class="fold-body">
      <div class="hint">Startkapital ist dein Depotstand (${eur(pjStart)}). Reine Modellrechnung mit konstanter Rendite — die Realität schwankt, teils kräftig.</div>
      <div class="proj-inputs">
        <label><input type="number" step="25" min="0" class="inline-num" style="width:66px" value="${pjMonthly}" data-proj="monthly"> € / Monat</label>
        <label><input type="number" step="1" min="1" max="45" class="inline-num" style="width:46px" value="${pjYears}" data-proj="years"> Jahre</label>
        <label><input type="number" step="0.5" min="0" max="15" class="inline-num" style="width:52px" value="${pjRate}" data-proj="rate"> % p. a.</label>
      </div>
      <svg viewBox="0 0 ${PW} ${PH}" width="100%" height="${PH}" preserveAspectRatio="none" role="img" aria-label="Vermögensentwicklung">
        <defs>
          <linearGradient id="gGain" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4E9C7C" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#4E9C7C" stop-opacity="0.05"/>
          </linearGradient>
        </defs>
        <line x1="${PLx}" y1="${PH-PB}" x2="${PW-PLx}" y2="${PH-PB}" stroke="#2A323D" stroke-width="1"/>
        <path d="${pjArea('v')}" fill="url(#gGain)"/>
        <path d="${pjArea('paid')}" fill="#5C7A99" fill-opacity="0.45"/>
        <path d="${pjLine('v')}" fill="none" stroke="#4E9C7C" stroke-width="2"/>
        <path d="${pjLine('paid')}" fill="none" stroke="#5C7A99" stroke-width="1.5" stroke-dasharray="3 3"/>
        ${pjTicks}
      </svg>
      <div class="proj-legend">
        <span><i class="proj-key" style="background:#5C7A99"></i>Eingezahlt ${eur(pjEnd.paid)}</span>
        <span><i class="proj-key" style="background:#4E9C7C"></i>Endwert ${eur(pjEnd.v)}</span>
      </div>
      <div class="split-hint">Von den ${eur(pjEnd.v)} kämen <b>${eur(pjGain)}</b> nicht von dir, sondern aus dem Zinseszins — das ist ${pjEnd.paid>0?Math.round(pjGain/pjEnd.paid*100):0}&nbsp;% obendrauf auf deine Einzahlungen. Der Hebel ist die Laufzeit, nicht die Sparrate: dieselbe Rate über 25 statt 15 Jahre verändert das Ergebnis stärker als eine Verdopplung des Betrags.</div>
      </div>
    </details>

    <details class="card-fold" data-tab="vermoegen">
      <summary><h2>Spar- & Anlagetipps</h2></summary>
      <div class="fold-body">
      <div class="hint">Aus deinen eigenen Zahlen abgeleitet — aktualisiert sich mit jedem Eintrag.</div>
      ${tipRows}
      <div class="disclaimer">Das sind allgemeine Hinweise und Rechenbeispiele, keine Anlageberatung — ich kenne weder deine Steuersituation noch deine Risikotragfähigkeit vollständig. Für verbindliche Entscheidungen (Depot, Versicherungen, Steuer) ist eine Beratung durch eine qualifizierte Person der richtige Weg.</div>
      </div>
    </details>

    <div class="card" data-tab="vermoegen">
      <div class="card-head"><h2>Kleinunternehmen</h2>
        <div style="display:flex;gap:6px;">
          <button class="add-btn" data-action="add-biz">+ Einnahme</button>
          <button class="add-btn" data-action="add-biz-out">+ Ausgabe</button>
        </div>
      </div>
      <div class="hint">Läuft getrennt vom Privaten — taucht nicht in den Monatszahlen oben auf.</div>
      <table><tbody>${bizRows || ''}
        ${(monthData.business||[]).length? `<tr class="sum-row"><td colspan="3">Netto ${monthLabel(currentMonthKey)}</td><td class="amount">${eur(bizMonthTotal)}</td><td></td></tr>`:''}
      </tbody></table>
      ${!bizRows ? `<div class="hint" style="margin-top:6px;">Noch nichts erfasst in diesem Monat.</div>`:''}
      <div class="biz-flow">
        <div class="biz-line"><span>Einnahmen ${year}</span><span class="amount-txt">${eur(biz.ein)}</span></div>
        <div class="biz-line"><span>− Ausgaben ${year}</span><span class="amount-txt" style="color:var(--neg)">− ${eur(biz.aus)}</span></div>
        <div class="biz-line" style="border-top:1px solid var(--line);margin-top:4px;padding-top:8px;"><span><b>Gewinn ${year}</b></span><span class="amount-txt"><b>${eur(biz.total)}</b></span></div>
        <div class="biz-line">
          <span>Steuerrücklage (<input type="number" min="0" max="60" class="inline-num" value="${bizRate}" data-invest="bizTaxRate"> % Grenzsteuersatz)</span>
          <span class="amount-txt" style="color:var(--neg)">− ${eur(bizTax)}</span>
        </div>
        <div class="biz-line">
          <span>Sparanteil (<input type="number" min="0" max="60" class="inline-num" value="${bizSaveRateVal}" data-invest="bizSaveRate"> %)</span>
          <span class="amount-txt" style="color:var(--muted)">− ${eur(bizSave)}</span>
        </div>
        <div class="biz-line result"><span>Gönn-Topf ${year}</span><span class="amount-txt">${eur(bizFree)}</span></div>
      </div>
      <div class="split-hint">
        Auf dem Kleingewerbe-Konto liegen aktuell <b>${eur(gewerbeSum)}</b> —
        ${gewerbeSum >= (bizTax+bizSave)
          ? `Rücklage (${eur(bizTax)}) und Sparanteil (${eur(bizSave)}) sind damit gedeckt. Alles darüber ist Gönn-Topf.`
          : `benötigt für Rücklage + Sparanteil: <b>${eur(bizTax+bizSave)}</b>. Am besten nichts entnehmen, bis die Lücke geschlossen ist.`}
      </div>
      <div class="split-hint">Faustregel für nebenberufliches Gewerbe neben Beamtengehalt: dein Kleingewerbe-Gewinn wird zu deinem <b>persönlichen Grenzsteuersatz</b> versteuert — der liegt on top vom Beamtengehalt oft schon bei 35–42&nbsp;%, plus Soli/Kirchensteuer. Lieber die Rücklage etwas zu hoch ansetzen als zu niedrig; ein Steuerberater kann den genauen Satz aus deinem letzten Bescheid ableiten. Der Sparanteil (z. B. 15–25&nbsp;%) ist dein eigener Puffer für Anschaffungen (Maschinen, Fahrzeug) oder Altersvorsorge — unabhängig vom Finanzamt. Beide Sätze beziehen sich auf den Gewinn (Einnahmen − Ausgaben), nicht auf den rohen Umsatz. Was danach übrig bleibt, ist wirklich frei verfügbar.</div>
    </div>

    <details class="settings" data-tab="vermoegen">
      <summary>Kontobewegungen erfassen</summary>
      <div class="card">
        <div class="hint">Für Spar-, Depot- oder Kleingewerbe-Konto einzelne Ein- und Auszahlungen protokollieren — praktisch, um später nachzuvollziehen, woher eine Kontostand-Änderung kam. Der Kontostand oben bleibt manuell editierbar; hier kannst du die Bewegungen des laufenden Monats optional draufrechnen. Tipp: schneller geht's über das ↕ direkt neben jedem Konto in „Vermögen".</div>
        <div class="fg-list" style="margin-top:10px;">
        ${(settings.accounts||[]).map(a=>`
          <button type="button" class="fg-head" style="width:100%;" data-action="open-acctx" data-acc="${a.id}">
            <span class="fg-badge" style="background:var(--panel-alt);color:var(--muted)">📖</span>
            <span class="fg-head-text"><span class="fg-title">${escHtml(a.label)}</span><span class="fg-sub">Bewegungen erfassen</span></span>
          </button>`).join('')}
        </div>
      </div>
    </details>

    <details class="card-fold" data-tab="vermoegen">
      <summary><h2>Verlauf & Jahr ${year}</h2></summary>
      <div class="fold-body">
      <div class="hint">${balWord==='Fehlbetrag'?'Fehlbetrag':'Überschuss'} der letzten 6 Monate</div>
      <div class="trend">${trendBars}</div>
      <div class="hint" style="margin-top:14px;">Summiert über die erfassten Monate in ${year} (${ys.months} ${ys.months===1?'Monat':'Monate'}).</div>
      <div class="pair-grid" style="grid-template-columns:1fr auto;">
        <span>Einnahmen</span><span class="v">${eur(ys.inc)}</span>
        <span>Ausgaben (Ist)</span><span class="v">${eur(ys.exp)}</span>
        <span>Challenge-Kosten</span><span class="v">${eur(challenge.total)}</span>
        <span>Kleingewerbe-Umsatz</span><span class="v">${eur(biz.total)}</span>
        <span class="tot">Gespart ${year}</span><span class="v tot ${ys.save>=0?'pos':'neg'}">${eur(ys.save)}</span>
        <span>Sparquote Jahr</span><span class="v ${ysRate>=15?'pos':''}">${ysRate}&nbsp;%</span>
      </div>
      </div>
    </details>

    <details class="settings" data-tab="vermoegen">
      <summary>Kategorien verwalten</summary>
      <div class="card">
        <table><tbody>
        ${settings.categories.map(c=>`
          <tr class="row" data-kind="category" data-id="${c.id}">
            <td class="name-cell"><input type="text" value="${escAttr(c.label)}" data-field="label"></td>
            <td style="width:118px;text-align:right;"><span class="note" style="display:inline">Limit </span><input type="number" step="10" class="inline-num" value="${Number(c.budget||0)}" data-field="budget"> €</td>
            <td style="width:44px"><input type="color" value="${c.color}" data-field="color" style="width:36px;height:26px;border:none;background:none;padding:0;"></td>
          </tr>`).join('')}
        </tbody></table>
        <div class="hint" style="margin-top:6px;">Limit = monatliches Budget für variable Ausgaben in dieser Kategorie. 0 = kein Limit.</div>
        <button class="add-btn" style="width:100%;margin-top:12px;" data-action="open-add-cat">+ Kategorie hinzufügen</button>
      </div>
    </details>
  `;
  app.setAttribute('data-active-tab', activeTab);

  const tabbar = document.getElementById('tabbar');
  const TABS = [['monat','Monat','📇'],['haushalt','Haushalt','🛒'],['paar','Paar','🤝'],['vermoegen','Vermögen','🌱']];
  tabbar.innerHTML = TABS.map(([id,label,ic])=>
    `<button class="tab ${activeTab===id?'active':''}" data-action="switch-tab" data-tab-id="${id}">
       <span class="tab-ic">${ic}</span>${label}
     </button>`).join('');
}

function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

// ---------- Event delegation ----------
document.addEventListener('click', async (e)=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;

  if(action==='prev-month'){ await loadMonth(shiftMonth(currentMonthKey,-1)); await loadHistory(); render(); return; }
  if(action==='next-month'){ await loadMonth(shiftMonth(currentMonthKey,1)); await loadHistory(); render(); return; }

  if(action==='switch-tab'){
    activeTab = btn.dataset.tabId;
    try{ localStorage.setItem('kassenbuch:ui:tab', activeTab); }catch(e){}
    render();
    window.scrollTo({top:0});
    return;
  }
  if(action==='toggle-group'){
    const cat=btn.dataset.cat;
    expandedGroups.has(cat) ? expandedGroups.delete(cat) : expandedGroups.add(cat);
    render(); return;
  }
  if(action==='toggle-all-groups'){
    if(expandedGroups.size>0){ expandedGroups.clear(); }
    else { settings.fixedCosts.forEach(f=>expandedGroups.add(f.category)); }
    render(); return;
  }
  if(action==='export-backup'){ exportBackup(); return; }
  if(action==='import-backup'){ document.getElementById('import-file').click(); return; }

  if(action==='close-sheet'){ closeSheet(); return; }
  if(action==='sheet-submit'){ if(sheetSubmitHandler){ await sheetSubmitHandler(); } return; }
  if(action==='sheet-chip'){
    btn.parentElement.querySelectorAll('.cchip').forEach(c=>c.classList.remove('selected'));
    btn.classList.add('selected');
    return;
  }
  if(action==='undo-delete'){
    if(lastUndo){ await lastUndo.restore(); lastUndo=null; }
    hideToast();
    return;
  }

  if(action==='add-income'){
    monthData.income.push({id:uid(), label:'Neue Einnahme', amount:0, person:'ich'});
    await storageSet(`month:${currentMonthKey}`, monthData); await loadHistory(); render(); return;
  }
  if(action==='add-kindergeld'){
    const n = (monthData.income||[]).filter(i=>i.person==='gemeinsam' && /kindergeld/i.test(i.label||'')).length;
    monthData.income.push({id:uid(), label: n?`Kindergeld ${n+1}. Kind`:'Kindergeld', amount:KINDERGELD_2026, person:'gemeinsam'});
    await storageSet(`month:${currentMonthKey}`, monthData); await loadHistory(); render(); return;
  }
  if(action==='del-income'){
    if(!handleDeleteTap(btn)) return;
    const removed = monthData.income.find(i=>i.id===btn.dataset.id);
    monthData.income = monthData.income.filter(i=>i.id!==btn.dataset.id);
    await storageSet(`month:${currentMonthKey}`, monthData); await loadHistory(); render();
    showUndoToast(`„${removed.label}" gelöscht`, async ()=>{
      monthData.income.push(removed); await storageSet(`month:${currentMonthKey}`, monthData); await loadHistory(); render();
    });
    return;
  }

  if(action==='add-fixed'){
    settings.fixedCosts.push({id:uid(), label:'Neuer Posten', category:'sonstiges', amount:0, interval:'monat', anchor:1, scope:'gemeinsam', who:'ich'});
    expandedGroups.add('sonstiges');
    await storageSet('settings', settings); render(); return;
  }
  if(action==='del-fixed'){
    if(!handleDeleteTap(btn)) return;
    const removed = settings.fixedCosts.find(f=>f.id===btn.dataset.id);
    settings.fixedCosts = settings.fixedCosts.filter(f=>f.id!==btn.dataset.id);
    await storageSet('settings', settings); await loadHistory(); render();
    showUndoToast(`„${removed.label}" gelöscht`, async ()=>{
      settings.fixedCosts.push(removed); await storageSet('settings', settings); await loadHistory(); render();
    });
    return;
  }

  if(action==='open-add-tx'){
    const cats = settings.categories.map(cc=>`<button type="button" class="cchip ${cc.id==='spontan'?'selected':''}" data-action="sheet-chip" data-cat="${cc.id}">
        <span class="dot" style="background:${cc.color}"></span>${cc.label}</button>`).join('');
    const acctChips = `<button type="button" class="cchip selected" data-action="sheet-chip" data-acc="giro">Girokonto</button>` +
      (settings.accounts||[]).map(a=>`<button type="button" class="cchip" data-action="sheet-chip" data-acc="${a.id}">${escHtml(a.label)}</button>`).join('');
    openSheet('Neue Bewegung', `
      <div class="field"><label>Bezeichnung</label><input type="text" id="s-tx-label" placeholder="z. B. Baumarkt" autofocus></div>
      <div class="field"><label>Betrag (€)</label><input type="number" step="0.01" inputmode="decimal" id="s-tx-amount" placeholder="0,00"></div>
      <div class="field"><label>Datum</label><input type="date" id="s-tx-date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Kategorie</label><div class="chip-grid" id="s-tx-cats">${cats}</div></div>
      <div class="field"><label>Abgebucht von</label><div class="chip-grid" id="s-tx-accts">${acctChips}</div>
        <div class="hint" style="margin-top:4px;">Girokonto zählt in den Kassensturz. Ein anderes Konto bucht die Ausgabe stattdessen dort als Auszahlung — sie fließt nicht in deine Monatsausgaben ein.</div>
      </div>
      <button class="sheet-submit" data-action="sheet-submit">Hinzufügen</button>
    `, async ()=>{
      const label = document.getElementById('s-tx-label').value.trim() || 'Ausgabe';
      const amount = parseFloat(document.getElementById('s-tx-amount').value) || 0;
      const date = document.getElementById('s-tx-date').value;
      const selChip = document.querySelector('#s-tx-cats .cchip.selected');
      const category = selChip ? selChip.dataset.cat : (settings.categories[0]||{}).id;
      const selAcctChip = document.querySelector('#s-tx-accts .cchip.selected');
      const accId = selAcctChip ? selAcctChip.dataset.acc : 'giro';
      if(accId==='giro'){
        monthData.transactions.push({id:uid(), date, label, category, amount});
        await storageSet(`month:${currentMonthKey}`, monthData); await loadHistory(); closeSheet(); render();
      } else {
        monthData.accountTx = monthData.accountTx || {};
        monthData.accountTx[accId] = monthData.accountTx[accId] || [];
        const newId = uid();
        monthData.accountTx[accId].push({id:newId, date, label, amount, type:'aus'});
        await storageSet(`month:${currentMonthKey}`, monthData); closeSheet(); render();
        const accLabel = ((settings.accounts||[]).find(a=>a.id===accId)||{}).label || 'Konto';
        showUndoToast(`„${label}" auf ${accLabel} gebucht — unter Vermögen „In Kontostand übernehmen"`, async ()=>{
          monthData.accountTx[accId] = (monthData.accountTx[accId]||[]).filter(t=>t.id!==newId);
          await storageSet(`month:${currentMonthKey}`, monthData); render();
        });
      }
    });
    return;
  }
  if(action==='del-tx'){
    if(!handleDeleteTap(btn)) return;
    const removed = monthData.transactions.find(t=>t.id===btn.dataset.id);
    monthData.transactions = monthData.transactions.filter(t=>t.id!==btn.dataset.id);
    await storageSet(`month:${currentMonthKey}`, monthData); await loadHistory(); render();
    showUndoToast(`„${removed.label}" gelöscht`, async ()=>{
      monthData.transactions.push(removed); await storageSet(`month:${currentMonthKey}`, monthData); await loadHistory(); render();
    });
    return;
  }

  if(action==='add-biz'){
    monthData.business = monthData.business || [];
    monthData.business.push({id:uid(), date:new Date().toISOString().slice(0,10), label:'Auftrag', amount:0, type:'ein'});
    await storageSet(`month:${currentMonthKey}`, monthData); render(); return;
  }
  if(action==='add-biz-out'){
    monthData.business = monthData.business || [];
    monthData.business.push({id:uid(), date:new Date().toISOString().slice(0,10), label:'Ausgabe', amount:0, type:'aus'});
    await storageSet(`month:${currentMonthKey}`, monthData); render(); return;
  }
  if(action==='del-biz'){
    if(!handleDeleteTap(btn)) return;
    const removed = (monthData.business||[]).find(b=>b.id===btn.dataset.id);
    monthData.business = (monthData.business||[]).filter(b=>b.id!==btn.dataset.id);
    await storageSet(`month:${currentMonthKey}`, monthData); render();
    showUndoToast(`„${removed.label}" gelöscht`, async ()=>{
      monthData.business.push(removed); await storageSet(`month:${currentMonthKey}`, monthData); render();
    });
    return;
  }

  if(action==='open-acctx'){ openAccountLedger(btn.dataset.acc); return; }
  if(action==='add-acctx'){
    const accId = btn.dataset.acc;
    const labelEl = document.getElementById('s-acctx-label');
    const amountEl = document.getElementById('s-acctx-amount');
    const dateEl = document.getElementById('s-acctx-date');
    const label = labelEl.value.trim() || 'Buchung';
    const amount = parseFloat(amountEl.value)||0;
    const date = dateEl.value || new Date().toISOString().slice(0,10);
    const typeChip = document.querySelector('#sheet .cchip.selected');
    const type = typeChip ? typeChip.dataset.type : 'ein';
    if(amount>0){
      monthData.accountTx = monthData.accountTx || {};
      monthData.accountTx[accId] = monthData.accountTx[accId] || [];
      monthData.accountTx[accId].push({id:uid(), date, label, amount, type});
      await storageSet(`month:${currentMonthKey}`, monthData);
    }
    openAccountLedger(accId);
    return;
  }
  if(action==='del-acctx'){
    if(!handleDeleteTap(btn)) return;
    const accId = btn.dataset.acc;
    monthData.accountTx[accId] = (monthData.accountTx[accId]||[]).filter(t=>t.id!==btn.dataset.id);
    await storageSet(`month:${currentMonthKey}`, monthData);
    openAccountLedger(accId);
    return;
  }
  if(action==='apply-acctx'){
    const accId = btn.dataset.acc;
    const acc = (settings.accounts||[]).find(a=>a.id===accId);
    if(acc){
      const list = (monthData.accountTx && monthData.accountTx[accId]) || [];
      const netto = list.reduce((s,t)=>s+(t.type==='aus'?-Number(t.amount||0):Number(t.amount||0)),0);
      acc.amount = Math.round((Number(acc.amount||0)+netto)*100)/100;
      await storageSet('settings', settings);
    }
    closeSheet(); render();
    return;
  }
  if(action==='open-add-account'){
    const opts = ACCOUNT_TYPES_JS.map(ty=>`<option value="${ty.id}">${ty.label}</option>`).join('');
    openSheet('Neues Konto', `
      <div class="field"><label>Kontoname</label><input type="text" id="s-acc-label" placeholder="z. B. Tagesgeld" autofocus></div>
      <div class="field"><label>Art</label><select id="s-acc-type">${opts}</select></div>
      <div class="field"><label>Aktueller Stand (€)</label><input type="number" step="0.01" inputmode="decimal" id="s-acc-amount" placeholder="0,00"></div>
      <button class="sheet-submit" data-action="sheet-submit">Hinzufügen</button>
    `, async ()=>{
      const label = document.getElementById('s-acc-label').value.trim() || 'Konto';
      const type = document.getElementById('s-acc-type').value;
      const amount = parseFloat(document.getElementById('s-acc-amount').value) || 0;
      settings.accounts = settings.accounts || [];
      settings.accounts.push({id:uid(), label, type, amount});
      await storageSet('settings', settings); closeSheet(); render();
    });
    return;
  }
  if(action==='del-account'){
    if(!handleDeleteTap(btn)) return;
    const removed = (settings.accounts||[]).find(a=>a.id===btn.dataset.id);
    settings.accounts = (settings.accounts||[]).filter(a=>a.id!==btn.dataset.id);
    await storageSet('settings', settings); render();
    showUndoToast(`„${removed.label}" gelöscht`, async ()=>{
      settings.accounts.push(removed); await storageSet('settings', settings); render();
    });
    return;
  }

  if(action==='add-goal'){
    settings.goals = settings.goals || [];
    settings.goals.push({id:uid(), label:'Neues Ziel', target:1000, current:0, monthly:100});
    await storageSet('settings', settings); render(); return;
  }
  if(action==='del-goal'){
    if(!handleDeleteTap(btn)) return;
    const removed = (settings.goals||[]).find(g=>g.id===btn.dataset.id);
    settings.goals = (settings.goals||[]).filter(g=>g.id!==btn.dataset.id);
    await storageSet('settings', settings); render();
    showUndoToast(`„${removed.label}" gelöscht`, async ()=>{
      settings.goals.push(removed); await storageSet('settings', settings); render();
    });
    return;
  }

  if(action==='open-add-hh'){
    const hhCategories = settings.hhCategories || HOUSEHOLD_CATEGORY_DEFAULTS;
    const cats = hhCategories.map(cc=>`<button type="button" class="cchip ${cc.id==='sonstiges'?'selected':''}" data-action="sheet-chip" data-cat="${cc.id}">
        <span class="dot" style="background:${cc.color}"></span>${cc.label}</button>`).join('');
    openSheet('Neue Ausgabe', `
      <div class="field"><label>Bezeichnung</label><input type="text" id="s-hh-label" placeholder="z. B. REWE" autofocus></div>
      <div class="field"><label>Betrag (€)</label><input type="number" step="0.01" inputmode="decimal" id="s-hh-amount" placeholder="0,00"></div>
      <div class="field"><label>Datum</label><input type="date" id="s-hh-date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Kategorie</label><div class="chip-grid" id="s-hh-cats">${cats}</div></div>
      <button class="sheet-submit" data-action="sheet-submit">Hinzufügen</button>
    `, async ()=>{
      const label = document.getElementById('s-hh-label').value.trim() || 'Ausgabe';
      const amount = parseFloat(document.getElementById('s-hh-amount').value) || 0;
      const date = document.getElementById('s-hh-date').value;
      const selChip = document.querySelector('#s-hh-cats .cchip.selected');
      const category = selChip ? selChip.dataset.cat : (hhCategories[0]||{}).id;
      monthData.household = monthData.household || [];
      monthData.household.push({id:uid(), date, label, category, amount});
      await storageSet(`month:${currentMonthKey}`, monthData); closeSheet(); render();
    });
    return;
  }
  if(action==='del-hh'){
    if(!handleDeleteTap(btn)) return;
    const removed = (monthData.household||[]).find(h=>h.id===btn.dataset.id);
    monthData.household = (monthData.household||[]).filter(h=>h.id!==btn.dataset.id);
    await storageSet(`month:${currentMonthKey}`, monthData); render();
    showUndoToast(`„${removed.label}" gelöscht`, async ()=>{
      monthData.household.push(removed); await storageSet(`month:${currentMonthKey}`, monthData); render();
    });
    return;
  }
  if(action==='import-hh-csv'){ document.getElementById('import-hh-csv').click(); return; }
  if(action==='import-hh-shot'){ document.getElementById('import-hh-shot').click(); return; }
  if(action==='open-add-hhcat'){
    openSheet('Neue Kategorie', `
      <div class="field"><label>Name</label><input type="text" id="s-hhcat-label" placeholder="z. B. Tierbedarf" autofocus></div>
      <div class="field"><label>Farbe</label><input type="color" id="s-hhcat-color" value="#8B94A3" style="height:44px;padding:2px;"></div>
      <button class="sheet-submit" data-action="sheet-submit">Hinzufügen</button>
    `, async ()=>{
      const label = document.getElementById('s-hhcat-label').value.trim();
      const color = document.getElementById('s-hhcat-color').value;
      if(label){ settings.hhCategories = settings.hhCategories || []; settings.hhCategories.push({id:uid(), label, color}); await storageSet('settings', settings); }
      closeSheet(); render();
    });
    return;
  }
  if(action==='open-add-cat'){
    openSheet('Neue Kategorie', `
      <div class="field"><label>Name</label><input type="text" id="s-cat-label" placeholder="z. B. Kinder" autofocus></div>
      <div class="field"><label>Farbe</label><input type="color" id="s-cat-color" value="#8B94A3" style="height:44px;padding:2px;"></div>
      <button class="sheet-submit" data-action="sheet-submit">Hinzufügen</button>
    `, async ()=>{
      const label = document.getElementById('s-cat-label').value.trim();
      const color = document.getElementById('s-cat-color').value;
      if(label){ settings.categories.push({id:uid(), label, color, budget:0}); await storageSet('settings', settings); }
      closeSheet(); render();
    });
    return;
  }
});

document.addEventListener('change', async (e)=>{
  if(e.target.id==='import-file'){
    if(e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
    e.target.value=''; return;
  }
  if(e.target.id==='import-hh-csv'){
    if(e.target.files && e.target.files[0]) importHouseholdCsv(e.target.files[0]);
    e.target.value=''; return;
  }
  if(e.target.id==='import-hh-shot'){
    if(e.target.files && e.target.files[0]) handleScreenshotFile(e.target.files[0]);
    e.target.value=''; return;
  }
  // Paar-Aufteilung: Einkommen & Partnername
  const hhCell = e.target.closest('[data-household]');
  if(hhCell){
    const key = hhCell.dataset.household;
    settings.household = settings.household || {};
    settings.household[key] = (key==='partnerName') ? hhCell.value : (parseFloat(hhCell.value)||0);
    await storageSet('settings', settings);
    render();
    return;
  }
  // Haushaltskonto-Budget
  const hhBudgetCell = e.target.closest('[data-hhbudget]');
  if(hhBudgetCell){
    settings.householdBudget = parseFloat(hhBudgetCell.value)||0;
    await storageSet('settings', settings);
    render();
    return;
  }
  // Haushaltskonto: Kontostand-Abgleich
  const hhFieldCell = e.target.closest('[data-hhfield]');
  if(hhFieldCell){
    const key = hhFieldCell.dataset.hhfield;
    const raw = hhFieldCell.value;
    if(key==='actual'){ monthData.hhActualBalance = raw==='' ? null : parseFloat(raw); }
    else if(key==='opening'){ monthData.hhOpening = parseFloat(raw)||0; }
    else if(key==='inflow'){ monthData.hhInflow = parseFloat(raw)||0; }
    await storageSet(`month:${currentMonthKey}`, monthData);
    render();
    return;
  }
  // Projektionsrechner
  const projCell = e.target.closest('[data-proj]');
  if(projCell){
    settings.projection = settings.projection || { monthly:300, years:20, rate:6 };
    settings.projection[projCell.dataset.proj] = parseFloat(projCell.value)||0;
    await storageSet('settings', settings);
    render();
    return;
  }
  // Einstellungen der Karten "Überschuss verteilen" & "Kleinunternehmen"
  const investCell = e.target.closest('[data-invest]');
  if(investCell){
    const key = investCell.dataset.invest;
    const value = parseFloat(investCell.value)||0;
    if(key==='bizTaxRate'){ settings.bizTaxRate = value; }
    else if(key==='bizSaveRate'){ settings.bizSaveRate = value; }
    else { settings.invest[key] = value; }
    await storageSet('settings', settings);
    render();
    return;
  }

  const cell = e.target.closest('[data-field]');
  if(!cell) return;
  const row = e.target.closest('[data-kind]');
  if(!row) return;
  const kind = row.dataset.kind, id = row.dataset.id, field = cell.dataset.field;
  let value = cell.value;
  if(field==='amount') value = parseFloat(value)||0;
  if(field==='anchor') value = parseInt(value)||1;
  if(field==='target'||field==='current'||field==='monthly') value = parseFloat(value)||0;
  if(field==='budget') value = parseFloat(value)||0;

  if(kind==='income'){
    const item = monthData.income.find(i=>i.id===id); if(item){ item[field]=value; await storageSet(`month:${currentMonthKey}`, monthData); }
  } else if(kind==='fixed'){
    const item = settings.fixedCosts.find(f=>f.id===id); if(item){ item[field]=value; await storageSet('settings', settings); }
  } else if(kind==='tx'){
    const item = monthData.transactions.find(t=>t.id===id); if(item){ item[field]=value; await storageSet(`month:${currentMonthKey}`, monthData); }
  } else if(kind==='biz'){
    const item = (monthData.business||[]).find(b=>b.id===id); if(item){ item[field]=value; await storageSet(`month:${currentMonthKey}`, monthData); }
  } else if(kind==='account'){
    const item = (settings.accounts||[]).find(a=>a.id===id); if(item){ item[field]=value; await storageSet('settings', settings); }
  } else if(kind==='category'){
    const item = settings.categories.find(c=>c.id===id); if(item){ item[field]=value; await storageSet('settings', settings); }
  } else if(kind==='goal'){
    const item = (settings.goals||[]).find(g=>g.id===id); if(item){ item[field]=value; await storageSet('settings', settings); }
  } else if(kind==='household'){
    const item = (monthData.household||[]).find(h=>h.id===id); if(item){ item[field]=value; await storageSet(`month:${currentMonthKey}`, monthData); }
  } else if(kind==='hhcategory'){
    const item = (settings.hhCategories||[]).find(c=>c.id===id); if(item){ item[field]=value; await storageSet('settings', settings); }
  }
  await loadHistory();
  render();
});

init();
